<!-- Click a figure to open it full screen; zoom with the wheel or a pinch, drag to pan. -->
<style>
main img.figure-img { cursor: zoom-in; }
.fz-overlay {
  position: fixed; inset: 0; z-index: 2000; background: rgba(20, 22, 24, .92);
  overflow: hidden; touch-action: none; cursor: grab; user-select: none;
}
.fz-overlay[hidden] { display: none; }
.fz-overlay.dragging { cursor: grabbing; }
.fz-img {
  position: absolute; left: 0; top: 0; max-width: none; transform-origin: 0 0;
  background: #fff; border-radius: 4px; box-shadow: 0 4px 24px rgba(0, 0, 0, .4);
  -webkit-user-drag: none; pointer-events: none;
}
.fz-close {
  position: absolute; top: 12px; right: 12px; width: 44px; height: 44px; border: 0;
  border-radius: 22px; background: rgba(20, 22, 24, .75); color: #fff; font-size: 28px;
  line-height: 44px; cursor: pointer;
}
.fz-close:hover, .fz-close:focus-visible { background: rgba(20, 22, 24, .95); }
.fz-bar {
  position: absolute; left: 0; right: 0; bottom: 0; padding: 10px 16px 14px;
  color: #e8e8e8; font-size: 14px; line-height: 1.4; text-align: center;
  background: rgba(20, 22, 24, .85); pointer-events: none;
}
.fz-bar small { display: block; color: #aaa; margin-top: 2px; }
</style>
<script>
(() => {
  const figures = document.querySelectorAll("main img.figure-img");
  if (!figures.length) return;

  const overlay = document.createElement("div");
  overlay.className = "fz-overlay";
  overlay.hidden = true;
  overlay.setAttribute("role", "dialog");
  overlay.setAttribute("aria-modal", "true");
  overlay.innerHTML =
    '<img class="fz-img" alt=""><button class="fz-close" aria-label="Close">&times;</button>' +
    '<div class="fz-bar"><span class="fz-caption"></span>' +
    "<small>Scroll or pinch to zoom, drag to pan, double-click or double-tap to zoom in or reset, Esc to close</small></div>";
  document.body.append(overlay);
  const big = overlay.querySelector(".fz-img");
  const caption = overlay.querySelector(".fz-caption");
  const closeButton = overlay.querySelector(".fz-close");

  // The image is laid out at its zoomed size rather than scaled with a transform,
  // so the SVG is redrawn crisp at every zoom level instead of a blurred bitmap.
  let w = 0, h = 0, fit = 1, s = 1, x = 0, y = 0, opener = null;
  const MAX = 8;

  function apply() {
    big.style.width = `${w * s}px`;
    big.style.height = `${h * s}px`;
    big.style.transform = `translate(${x}px, ${y}px)`;
  }

  function reset() {
    const vw = overlay.clientWidth, vh = overlay.clientHeight;
    fit = Math.min((vw * 0.96) / w, (vh * 0.84) / h);
    s = fit;
    x = (vw - w * s) / 2;
    y = (vh - h * s) / 2 - vh * 0.04;
    apply();
  }

  function zoomAt(factor, cx, cy) {
    const next = Math.min(Math.max(s * factor, fit), fit * MAX);
    if (next === fit) return reset();
    const f = next / s;
    x = cx - (cx - x) * f;
    y = cy - (cy - y) * f;
    s = next;
    apply();
  }

  function open(img) {
    opener = img;
    big.src = img.currentSrc || img.src;
    const fig = img.closest("figure");
    const cap = fig && fig.querySelector("figcaption");
    caption.textContent = cap ? cap.textContent.trim() : img.alt;
    overlay.hidden = false;
    document.documentElement.style.overflow = "hidden";
    const ready = () => {
      // An SVG reports its intrinsic size from its width and height attributes.
      w = big.naturalWidth || img.naturalWidth || 1000;
      h = big.naturalHeight || img.naturalHeight || 600;
      reset();
    };
    big.complete && big.naturalWidth ? ready() : (big.onload = ready);
    closeButton.focus();
  }

  function close() {
    overlay.hidden = true;
    document.documentElement.style.overflow = "";
    if (opener) opener.focus();
  }

  figures.forEach((img) => {
    img.tabIndex = 0;
    img.setAttribute("role", "button");
    img.setAttribute("aria-label", `Open full screen: ${img.alt || "figure"}`);
    img.addEventListener("click", () => open(img));
    img.addEventListener("keydown", (e) => {
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); open(img); }
    });
  });

  closeButton.addEventListener("click", close);
  document.addEventListener("keydown", (e) => {
    if (overlay.hidden) return;
    if (e.key === "Escape") close();
    else if (e.key === "+" || e.key === "=") zoomAt(1.25, overlay.clientWidth / 2, overlay.clientHeight / 2);
    else if (e.key === "-") zoomAt(0.8, overlay.clientWidth / 2, overlay.clientHeight / 2);
    else if (e.key === "0") reset();
  });
  window.addEventListener("resize", () => { if (!overlay.hidden) reset(); });

  overlay.addEventListener("wheel", (e) => {
    e.preventDefault();
    zoomAt(Math.exp(-e.deltaY * (e.deltaMode === 1 ? 0.05 : 0.002)), e.clientX, e.clientY);
  }, { passive: false });

  function toggleZoom(cx, cy) {
    s > fit * 1.05 ? reset() : zoomAt(2.5, cx, cy);
  }
  // A phone turns a double-tap into a dblclick too; the tap handler below has
  // already zoomed for it, and a second toggle would undo that.
  let touchToggled = 0;
  overlay.addEventListener("dblclick", (e) => {
    if (e.target === closeButton || Date.now() - touchToggled < 600) return;
    toggleZoom(e.clientX, e.clientY);
  });

  // One pointer pans; two pinch. A tap that never moved closes the viewer when
  // it lands outside the figure, and two quick taps zoom, for touch screens.
  const pointers = new Map();
  let pinch = null, moved = false, lastTap = 0, taps = 0;

  overlay.addEventListener("pointerdown", (e) => {
    if (e.target === closeButton) return;
    overlay.setPointerCapture(e.pointerId);
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pointers.size === 1) moved = false;
    pinch = null;
    overlay.classList.add("dragging");
  });

  overlay.addEventListener("pointermove", (e) => {
    const p = pointers.get(e.pointerId);
    if (!p) return;
    const dx = e.clientX - p.x, dy = e.clientY - p.y;
    if (Math.abs(dx) + Math.abs(dy) > 3) moved = true;
    p.x = e.clientX;
    p.y = e.clientY;
    if (pointers.size === 1) {
      x += dx;
      y += dy;
      apply();
    } else if (pointers.size === 2) {
      const [a, b] = [...pointers.values()];
      const dist = Math.hypot(a.x - b.x, a.y - b.y);
      const mid = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
      if (pinch) {
        x += mid.x - pinch.mid.x;
        y += mid.y - pinch.mid.y;
        zoomAt(dist / pinch.dist, mid.x, mid.y);
      }
      pinch = { dist, mid };
    }
  });

  function release(e) {
    if (!pointers.delete(e.pointerId)) return;
    pinch = null;
    if (pointers.size) return;
    overlay.classList.remove("dragging");
    if (moved || e.type === "pointercancel") return;
    const seq = ++taps;
    if (e.pointerType !== "mouse") {
      const now = Date.now();
      if (now - lastTap < 300) {
        lastTap = 0;
        touchToggled = now;
        return toggleZoom(e.clientX, e.clientY);
      }
      lastTap = now;
    }
    // Close on a tap outside the figure, unless a second tap follows (a double-tap).
    const r = big.getBoundingClientRect();
    const outside = e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom;
    if (outside) setTimeout(() => { if (taps === seq) close(); }, 310);
  }
  overlay.addEventListener("pointerup", release);
  overlay.addEventListener("pointercancel", release);
})();
</script>
