# API reference for wdm, generated from the package's docstrings.
# Regenerate after the code changes (the package source is in the private
# glorious-beard repository, next to this one):
#   body-weight/docs/build_reference.sh
quartodoc:
  package: wdm
  source_dir: ../../../glorious-beard/weight-dynamics/code/src
  dir: reference
  title: "API reference"
  style: pkgdown
  render_interlinks: false
  options:
    include_inherited: false
  sections:
    - title: "Configuration and data"
      desc: "The subject file, the observations CSV and its validation, and the daily bookkeeping."
      contents: [config, schema, io, daily, constants]
    - title: "The model"
      desc: "State and parameter types, the physiology, the step map, the observations."
      contents: [models.types, models.energetics, models.partition, models.glycogen, models.dynamics, models.observation]
    - title: "Filters"
      desc: "Model-agnostic Kalman, unscented and extended filters and smoothers."
      contents: [filters.common, filters.linear, filters.ukf, filters.ekf]
    - title: "Estimation"
      desc: "Phase 1 noise identification, phase 2 joint estimation, reparameterization, the backtest."
      contents: [estimation.noise_id, estimation.joint, estimation.reparam, estimation.backtest]
    - title: "Control"
      desc: "Cost terms and the receding-horizon controller."
      contents: [control.objectives, control.mpc]
    - title: "Exercise energy"
      desc: "MET estimates from a routine CSV or a dated workout spreadsheet."
      contents: [routine, exercise, tracker_write]
    - title: "Synthetic data, figures and the command line"
      contents: [synthetic, viz, cli]
