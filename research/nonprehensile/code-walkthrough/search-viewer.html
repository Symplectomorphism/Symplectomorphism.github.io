<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Search Rounds Viewer</title>
<style>
:root {
  --bg: #ffffff; --fg: #1f2328; --muted: #656d76; --line: #d0d7de; --panel: #f6f8fa;
  --ok: #1a7f37; --bad: #c62828; --idle: #b8c0c8; --node: #ffffff; --nodeline: #1f2328;
  --box: #e8a33d; --boxline: #7a4f0e; --disk: #3d6fe8; --diskline: #14307a; --ground: #d9dde1;
  --batch: #111111; --sel: #8250df;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1117; --fg: #e6edf3; --muted: #9198a1; --line: #30363d; --panel: #161b22;
    --ok: #3fb950; --bad: #f85149; --idle: #484f58; --node: #0d1117; --nodeline: #e6edf3;
    --box: #c98a2e; --boxline: #f0c27a; --disk: #6f95ff; --diskline: #b8ccff; --ground: #2b3138;
    --batch: #f0f6fc; --sel: #b58cff;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg);
  font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
.wrap { padding: 12px 16px 20px; }
.controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 8px; }
button { font: inherit; padding: 4px 10px; border: 1px solid var(--line); border-radius: 6px;
  background: var(--panel); color: var(--fg); cursor: pointer; }
button:hover { border-color: var(--muted); }
input[type=range] { flex: 1 1 220px; min-width: 160px; }
.status { font-weight: 600; margin: 2px 0 10px; }
.legend { display: flex; flex-wrap: wrap; gap: 14px; color: var(--muted); font-size: 12.5px; margin-bottom: 10px; }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
.main { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 14px; }
@media (max-width: 860px) { .main { grid-template-columns: 1fr; } }
.card { border: 1px solid var(--line); border-radius: 8px; background: var(--bg); padding: 8px; min-width: 0; }
.card h3 { margin: 2px 4px 6px; font-size: 13px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
#graphwrap { overflow: auto; max-height: 640px; }
svg text { fill: var(--fg); }
.batch { list-style: none; margin: 0; padding: 0; }
.batch li { padding: 4px 6px; border-radius: 6px; cursor: pointer; display: flex; gap: 8px; align-items: baseline; }
.batch li:hover, .batch li.sel { background: var(--panel); }
.info { font-size: 13px; white-space: pre-wrap; margin: 6px 4px 0; }
.info b { font-weight: 600; }
.ok { color: var(--ok); } .bad { color: var(--bad); }
#tip { position: fixed; pointer-events: none; background: var(--panel); border: 1px solid var(--line);
  border-radius: 6px; padding: 6px 8px; font-size: 12.5px; max-width: 360px; display: none; z-index: 5; }
.small { color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="controls">
    <button id="first" title="Before round 1">« Start</button>
    <button id="prev" title="Previous round">‹ Prev</button>
    <button id="play" title="Play rounds">▶ Play</button>
    <button id="next" title="Next round">Next ›</button>
    <button id="last" title="Last round">End »</button>
    <input id="slider" type="range" min="0" value="0" step="1" aria-label="Round">
  </div>
  <div class="status" id="status">Loading…</div>
  <div class="legend">
    <span><i class="dot" style="background:var(--idle)"></i>legal edit, not tried yet</span>
    <span><i class="dot" style="background:var(--bad)"></i>tried, rejected</span>
    <span><i class="dot" style="background:var(--ok)"></i>tried, accepted (link to the node it created)</span>
    <span><i class="dot" style="border:2px solid var(--batch)"></i>this round's batch</span>
    <span>Hover a dot for the edit; click a dot or node for details.</span>
  </div>
  <div class="main">
    <div class="card"><h3>Search tree (columns = depth)</h3><div id="graphwrap"><svg id="graph"></svg></div></div>
    <div class="card">
      <h3>This round's batch</h3>
      <ul class="batch" id="batch"></ul>
      <h3 style="margin-top:12px">Scene (+x to the left, as in the paper)</h3>
      <svg id="scene" viewBox="0 0 440 230" style="width:100%;height:auto"></svg>
      <div class="small" id="frame"></div>
      <div class="info" id="info"></div>
    </div>
  </div>
</div>
<div id="tip"></div>
<script>
"use strict";
const NS = "http://www.w3.org/2000/svg";
const el = (tag, attrs = {}, parent) => {
  const e = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  if (parent) parent.appendChild(e);
  return e;
};
const $ = (id) => document.getElementById(id);
let RUN, R, round = 0, selected = null, playTimer = null, animTimer = null;
const key = (node, dest) => node + "|" + dest.join(",");

fetch("media/search_run.json").then(r => r.json()).then(run => { RUN = run; init(); })
  .catch(err => { $("status").textContent = "Could not load media/search_run.json: " + err; });

function init() {
  R = RUN.rounds.length;
  // Which round tried each (node, destination), and the attempt itself.
  RUN.tried = new Map();
  RUN.rounds.forEach(rd => rd.attempts.forEach((a, i) => {
    a.round = rd.round; a.index = i; RUN.tried.set(key(a.node, a.dest), a);
  }));
  layout();
  const s = $("slider"); s.max = R; s.addEventListener("input", () => setRound(+s.value));
  $("first").onclick = () => setRound(0);
  $("last").onclick = () => setRound(R);
  $("prev").onclick = () => setRound(Math.max(0, round - 1));
  $("next").onclick = () => setRound(Math.min(R, round + 1));
  $("play").onclick = togglePlay;
  setRound(1);
}

function togglePlay() {
  if (playTimer) { clearInterval(playTimer); playTimer = null; $("play").textContent = "▶ Play"; return; }
  if (round >= R) setRound(0);
  $("play").textContent = "⏸ Pause";
  playTimer = setInterval(() => {
    if (round >= R) { togglePlay(); return; }
    setRound(round + 1);
  }, 1800);
}

// ---------- tree layout ----------
const COLW = 280, SLOT = 112, PET = 46, X0 = 60, Y0 = 100;
function layout() {
  const cols = new Map();
  RUN.nodes.forEach(n => {
    if (!cols.has(n.depth)) cols.set(n.depth, []);
    cols.get(n.depth).push(n);
  });
  let maxRows = 1;
  for (const [d, list] of cols) {
    list.sort((a, b) => (a.born - b.born) || (a.id - b.id));
    list.forEach((n, i) => { n.x = X0 + d * COLW; n.y = Y0 + i * SLOT; });
    maxRows = Math.max(maxRows, list.length);
  }
  RUN.nodes.forEach(n => {
    const L = n.legal.length, span = 160 * Math.PI / 180;
    n.legal.forEach((e, i) => {
      const t = L > 1 ? -span / 2 + span * i / (L - 1) : 0;
      e.px = n.x + PET * Math.cos(t); e.py = n.y + PET * Math.sin(t);
    });
  });
  const W = X0 + (Math.max(...cols.keys()) + 1) * COLW, H = Y0 + maxRows * SLOT;
  const g = $("graph");
  g.setAttribute("viewBox", `0 0 ${W} ${H}`);
  g.setAttribute("style", `width:100%;min-width:${Math.min(W, 640)}px;height:auto`);
  for (const d of cols.keys())
    el("text", { x: X0 + d * COLW - 16, y: 30, "font-size": 13, "font-weight": 600, fill: "var(--muted)" }, g)
      .textContent = d === 0 ? "root" : "depth " + d;
}

function drawGraph() {
  const g = $("graph");
  [...g.querySelectorAll(".dyn")].forEach(e => e.remove());
  const links = el("g", { class: "dyn" }, g), dots = el("g", { class: "dyn" }, g), nodes = el("g", { class: "dyn" }, g);
  const alive = RUN.nodes.filter(n => n.born <= round);
  for (const n of alive) {
    for (const e of n.legal) {
      const a = RUN.tried.get(key(n.id, e.dest));
      const done = a && a.round <= round, now = a && a.round === round;
      const color = !done ? "var(--idle)" : a.accepted ? "var(--ok)" : "var(--bad)";
      if (done && a.accepted && a.child !== null) {
        const c = RUN.nodes[a.child];
        if (c.born <= round) {
          const mx = (e.px + c.x) / 2;
          el("path", { d: `M${e.px},${e.py} C${mx},${e.py} ${mx},${c.y} ${c.x - 16},${c.y}`,
            fill: "none", stroke: "var(--ok)", "stroke-width": now ? 2.4 : 1.3, opacity: now ? 1 : 0.7 }, links);
        }
      }
      const isSel = selected && selected.type === "attempt" && a === selected.a;
      const d = el("circle", { cx: e.px, cy: e.py, r: now ? 5 : 4, fill: color,
        stroke: isSel ? "var(--sel)" : now ? "var(--batch)" : "none", "stroke-width": isSel ? 3 : 1.6,
        style: "cursor:pointer" }, dots);
      d.addEventListener("mousemove", ev => tip(ev, edgeTip(e, a, done)));
      d.addEventListener("mouseleave", () => tip(null));
      d.addEventListener("click", () => {
        if (done) select({ type: "attempt", a }); else select({ type: "untried", n, e });
      });
    }
  }
  for (const n of alive) {
    const isSel = selected && selected.type === "node" && selected.n === n;
    const fresh = n.born === round && round > 0;
    const c = el("circle", { cx: n.x, cy: n.y, r: 16, fill: "var(--node)",
      stroke: isSel ? "var(--sel)" : "var(--nodeline)", "stroke-width": isSel ? 3 : fresh ? 2.6 : 1.4,
      style: "cursor:pointer" }, nodes);
    el("text", { x: n.x, y: n.y + 4.5, "text-anchor": "middle", "font-size": 12, "font-weight": 600,
      style: "pointer-events:none" }, nodes).textContent = n.id;
    const extra = n.actual.length - n.stored.length;
    el("text", { x: n.x + 6, y: n.y + 62, "text-anchor": "middle", "font-size": 10.5,
      fill: extra > 0 ? "var(--bad)" : "var(--muted)" }, nodes)
      .textContent = `${n.stored.length} stored · ${n.actual.length} in band` ;
    c.addEventListener("mousemove", ev => tip(ev, `<b>node ${n.id}</b> (depth ${n.depth}, created in round ${n.born})<br>` +
      `stores ${n.stored.length} bits, ${n.actual.length} are in band at its pose` + (extra > 0 ? ` (<span class="bad">${extra} unrecorded</span>)` : "")));
    c.addEventListener("mouseleave", () => tip(null));
    c.addEventListener("click", () => select({ type: "node", n }));
  }
}

function edgeTip(e, a, done) {
  let s = `<b>${e.label}</b>`;
  if (!done) return s + "<br><span class='small'>legal here, not tried yet</span>";
  s += `<br>round ${a.round}: ` + (a.accepted ? "<span class='ok'>accepted by the search</span>" :
    "<span class='bad'>rejected</span>, not in band at the end: " + a.missing.map(m => `${m.name} (${m.gap_mm > 0 ? "+" : ""}${m.gap_mm} mm)`).join(", "));
  s += "<br>solver checks: " + (a.solver.length ? "<span class='bad'>fail</span>, " + a.solver.join("; ") : "<span class='ok'>pass</span>");
  return s;
}

function tip(ev, html) {
  const t = $("tip");
  if (!ev) { t.style.display = "none"; return; }
  t.innerHTML = html; t.style.display = "block";
  const x = Math.min(ev.clientX + 14, window.innerWidth - t.offsetWidth - 8);
  const y = Math.min(ev.clientY + 14, window.innerHeight - t.offsetHeight - 8);
  t.style.left = x + "px"; t.style.top = y + "px";
}

// ---------- round / batch ----------
function setRound(k) {
  round = k; $("slider").value = k;
  const rd = RUN.rounds[k - 1];
  const nodes = RUN.nodes.filter(n => n.born <= k).length;
  const tried = RUN.rounds.slice(0, k).reduce((s, r) => s + r.attempts.length, 0);
  const acc = RUN.rounds.slice(0, k).reduce((s, r) => s + r.attempts.filter(a => a.accepted).length, 0);
  $("status").textContent = k === 0
    ? `Before round 1: one node (the start pose) with ${RUN.nodes[0].legal.length} legal edits. ${R} rounds of 4 solver calls follow.`
    : `Round ${k} of ${R}: ${rd.attempts.filter(a => a.accepted).length} of ${rd.attempts.length} accepted. ` +
      `So far ${tried} solver calls, ${acc} accepted, ${nodes} nodes; ${rd.frontier} legal edits still untried.`;
  const ul = $("batch"); ul.innerHTML = "";
  if (rd) rd.attempts.forEach(a => {
    const li = document.createElement("li");
    li.innerHTML = `<i class="dot" style="background:${a.accepted ? "var(--ok)" : "var(--bad)"}"></i>` +
      `<span>node ${a.node}: <b>${a.label}</b> ${a.accepted ? `<span class="ok">→ node ${a.child}</span>` : `<span class="bad">rejected</span>`}</span>`;
    li.onclick = () => select({ type: "attempt", a });
    a.li = li; ul.appendChild(li);
  });
  else ul.innerHTML = "<li class='small'>No batch yet. Step forward to round 1.</li>";
  if (!selected || (selected.type === "attempt" && selected.a.round > k) || (selected.type === "node" && selected.n.born > k))
    selected = rd ? { type: "attempt", a: rd.attempts[0] } : { type: "node", n: RUN.nodes[0] };
  else if (rd && selected.type === "attempt" && selected.a.round !== k) selected = { type: "attempt", a: rd.attempts[0] };
  select(selected);
}

function select(s) {
  selected = s;
  document.querySelectorAll(".batch li").forEach(li => li.classList.remove("sel"));
  if (s.type === "attempt" && s.a.li && s.a.round === round) s.a.li.classList.add("sel");
  drawGraph();
  const info = $("info");
  if (s.type === "attempt") {
    const a = s.a;
    info.innerHTML = `<b>Round ${a.round}, from node ${a.node}: ${a.label}</b>\n` +
      `search: ${a.accepted ? `<span class="ok">accepted</span>, created node ${a.child}` :
        `<span class="bad">rejected</span>, not in band at the end: ` + a.missing.map(m => `${m.name} (${m.gap_mm > 0 ? "+" : ""}${m.gap_mm} mm)`).join(", ")}\n` +
      `solver checks: ${a.solver.length ? `<span class="bad">fail</span>, ` + a.solver.join("; ") : `<span class="ok">pass</span>`}`;
    playTraj(a.traj, RUN.nodes[a.node].qpos);
  } else if (s.type === "node") {
    const n = s.n, names = RUN.names;
    const unrec = n.actual.filter(i => !n.stored.includes(i)).map(i => names[i]);
    const tried = n.legal.filter(e => { const a = RUN.tried.get(key(n.id, e.dest)); return a && a.round <= round; }).length;
    info.innerHTML = `<b>Node ${n.id}</b> (depth ${n.depth}, created in round ${n.born})\n` +
      `qpos [box x, box z, box angle, disk x, disk z] = [${n.qpos.map(v => v.toFixed(4)).join(", ")}]\n` +
      `stores: {${n.stored.map(i => names[i]).join(", ")}}\n` +
      (unrec.length ? `<span class="bad">in band but not recorded:</span> {${unrec.join(", ")}}\n` : "in band: same as stored\n") +
      `legal edits here: ${n.legal.length}, tried by round ${round}: ${tried}`;
    playTraj([n.qpos], null);
  } else {
    info.innerHTML = `<b>${s.e.label}</b> from node ${s.n.id}\nLegal here (passes Near and Hold), not tried by round ${round}.`;
    playTraj([s.n.qpos], null);
  }
}

// ---------- scene ----------
const SX = (x) => 20 + (0.10 - x) / 0.37 * 400;   // +x to the left
const SY = (z) => 205 - z / 0.37 * 400;
function boxPts(q, a) {
  const c = Math.cos(q[2]), s = Math.sin(q[2]), h = a / 2;
  return [[-h, -h], [h, -h], [h, h], [-h, h]].map(([u, w]) =>
    `${SX(q[0] + u * c + w * s)},${SY(q[1] - u * s + w * c)}`).join(" ");
}
function playTraj(traj, start) {
  if (animTimer) { clearInterval(animTimer); animTimer = null; }
  const sc = RUN.scene, svg = $("scene"); svg.innerHTML = "";
  el("polygon", { points: `${SX(0.12)},${SY(sc.h)} ${SX(0)},${SY(sc.h)} ${SX(0)},${SY(0)} ${SX(-0.27)},${SY(0)} ${SX(-0.27)},230 ${SX(0.12)},230`,
    fill: "var(--ground)", stroke: "var(--muted)", "stroke-width": 1 }, svg);
  if (start) {
    el("polygon", { points: boxPts(start, sc.a), fill: "none", stroke: "var(--muted)", "stroke-dasharray": "4 3" }, svg);
    el("circle", { cx: SX(start[3]), cy: SY(start[4]), r: sc.r / 0.37 * 400, fill: "none", stroke: "var(--muted)", "stroke-dasharray": "4 3" }, svg);
  }
  const trail = el("polyline", { fill: "none", stroke: "var(--disk)", "stroke-width": 1.4 }, svg);
  const box = el("polygon", { fill: "var(--box)", stroke: "var(--boxline)", "stroke-width": 1.2, opacity: 0.9 }, svg);
  const disk = el("circle", { r: sc.r / 0.37 * 400, fill: "var(--disk)", stroke: "var(--diskline)" }, svg);
  let k = 0;
  const show = () => {
    const q = traj[k];
    box.setAttribute("points", boxPts(q, sc.a));
    disk.setAttribute("cx", SX(q[3])); disk.setAttribute("cy", SY(q[4]));
    trail.setAttribute("points", traj.slice(0, k + 1).map(p => `${SX(p[3])},${SY(p[4])}`).join(" "));
    $("frame").textContent = traj.length > 1
      ? `step ${k + 1} of ${traj.length} (${k < sc.horizon ? "task" : "dwell"}), shown 6× slower than real time`
      : "node pose";
  };
  show();
  if (traj.length > 1) animTimer = setInterval(() => {
    k = (k + 1) % (traj.length + 12);          // pause on the last frame before looping
    if (k < traj.length) show(); else if (k === traj.length) { k = traj.length - 1; show(); k = traj.length; }
  }, 60);
}
</script>
</body>
</html>
