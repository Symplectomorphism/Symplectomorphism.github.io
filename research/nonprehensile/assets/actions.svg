<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 50 940 288" width="100%" class="fig" role="img" aria-label="The three actions"><title>The three actions</title><rect x="56" y="60" width="262" height="104" rx="8" fill="#ffffff" stroke="#175b48" stroke-width="1.8"/><text x="187.00" y="90.00" font-size="18" fill="#175b48" text-anchor="middle" font-weight="700" font-family="'Latin Modern Math',Georgia,serif" style="" >make(c)</text><text x="187.00" y="120.00" font-size="17" fill="#1c2b26" text-anchor="middle" font-weight="400" font-family="'Latin Modern Math','STIX Two Math',Georgia,serif" style="" >&#963; &#8746; { c }</text><text x="187.00" y="146.00" font-size="13" fill="#6b7a74" text-anchor="middle" font-weight="400" font-family="'Source Sans Pro','Helvetica Neue',Arial,sans-serif" style="" >start holding a contact not yet held</text><rect x="341" y="60" width="262" height="104" rx="8" fill="#ffffff" stroke="#c0392b" stroke-width="1.8"/><text x="472.00" y="90.00" font-size="18" fill="#c0392b" text-anchor="middle" font-weight="700" font-family="'Latin Modern Math',Georgia,serif" style="" >break(c)</text><text x="472.00" y="120.00" font-size="17" fill="#1c2b26" text-anchor="middle" font-weight="400" font-family="'Latin Modern Math','STIX Two Math',Georgia,serif" style="" >&#963; &#8726; { c }</text><text x="472.00" y="146.00" font-size="13" fill="#6b7a74" text-anchor="middle" font-weight="400" font-family="'Source Sans Pro','Helvetica Neue',Arial,sans-serif" style="" >stop holding a contact that is held</text><rect x="626" y="60" width="262" height="104" rx="8" fill="#ffffff" stroke="#b8860b" stroke-width="1.8"/><text x="757.00" y="90.00" font-size="18" fill="#b8860b" text-anchor="middle" font-weight="700" font-family="'Latin Modern Math',Georgia,serif" style="" >transport</text><text x="757.00" y="120.00" font-size="17" fill="#1c2b26" text-anchor="middle" font-weight="400" font-family="'Latin Modern Math','STIX Two Math',Georgia,serif" style="" >&#963;</text><text x="757.00" y="146.00" font-size="13" fill="#6b7a74" text-anchor="middle" font-weight="400" font-family="'Source Sans Pro','Helvetica Neue',Arial,sans-serif" style="" >keep &#963; and drive toward the goal</text><text x="470.00" y="224.00" font-size="17" fill="#1c2b26" text-anchor="middle" font-weight="700" font-family="'Source Sans Pro','Helvetica Neue',Arial,sans-serif" style="" >A plan is a sequence of these.</text><text x="470.00" y="252.00" font-size="14" fill="#6b7a74" text-anchor="middle" font-weight="400" font-family="'Latin Modern Math',Georgia,serif" style="" >At most |<tspan font-style="italic">C</tspan>| + 1 at any state: one flip per catalog bit, plus transport.</text><text x="470.00" y="276.00" font-size="13" fill="#aab5b0" text-anchor="middle" font-weight="400" font-family="'Source Sans Pro','Helvetica Neue',Arial,sans-serif" style="" >that is 36 here &#8212; the two feasibility tests cut it to a handful</text><text x="470.00" y="312.00" font-size="16" fill="#175b48" text-anchor="middle" font-weight="600" font-family="'Source Sans Pro','Helvetica Neue',Arial,sans-serif" style="" >all the difficulty is in <tspan font-style='italic'>which flips are realizable from this pose</tspan></text></svg>
