2b" text-anchor="middle" font-weight="600" font-family="'Source Sans Pro','Helvetica Neue',Arial,sans-serif" style="" >only what is touching is in the state</text><text x="235.00" y="318.00" font-size="13" fill="#6b7a74" text-anchor="middle" font-weight="400" font-family="'Source Sans Pro','Helvetica Neue',Arial,sans-serif" style="" >the riser and the platform are invisible</text><text x="705.00" y="296.00" font-size="14.5" fill="#175b48" text-anchor="middle" font-weight="600" font-family="'Source Sans Pro','Helvetica Neue',Arial,sans-serif" style="" >&#8220;go establish contact s&#8221; is an ordinary action</text><text x="705.00" y="318.00" font-size="13" fill="#6b7a74" text-anchor="middle" font-weight="400" font-family="'Source Sans Pro','Helvetica Neue',Arial,sans-serif" style="" >unmade contacts are already in the state</text><line x1="470" y1="26" x2="470" y2="334" stroke="#dce3dd" stroke-width="1.4"/><text x="470.00" y="358.00" font-size="13.5" fill="#aab5b0" text-anchor="middle" font-weight="400" font-family="'Source Sans Pro','Helvetica Neue',Arial,sans-serif" style="" >this is the one structural difference that matters</text></svg>
