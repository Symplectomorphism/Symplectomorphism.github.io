<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 46 940 364" width="100%" class="fig" role="img" aria-label="The measurement"><title>The measurement</title><text x="470.00" y="58.00" font-size="15" fill="#175b48" text-anchor="middle" font-weight="600" font-family="'Latin Modern Math','STIX Two Math',Georgia,serif" style="" >N&#923; = calls to the local solver, from the query until the goal is reached</text><text x="300.00" y="107.00" font-size="13.5" fill="#1c2b26" text-anchor="end" font-weight="400" font-family="'Source Sans Pro','Helvetica Neue',Arial,sans-serif" style="" >no discrete search at all</text><rect x="316" y="86" width="384" height="30" rx="5" fill="#f4f6f4" stroke="#dce3dd" stroke-width="1"/><text x="328.00" y="106.00" font-size="13" fill="#6b4c9a" text-anchor="start" font-weight="600" font-family="'Source Sans Pro','Helvetica Neue',Arial,sans-serif" style="" >not yet measured</text><text x="712.00" y="106.00" font-size="12.5" fill="#aab5b0" text-anchor="start" font-weight="400" font-family="'Source Sans Pro','Helvetica Neue',Arial,sans-serif" style="" >run this first</text><text x="300.00" y="151.00" font-size="13.5" fill="#1c2b26" text-anchor="end" font-weight="400" font-family="'Source Sans Pro','Helvetica Neue',Arial,sans-serif" style="" >a different discrete object</text><rect x="316" y="130" width="384" height="30" rx="5" fill="#f4f6f4" stroke="#dce3dd" stroke-width="1"/><text x="328.00" y="150.00" font-size="13" fill="#6b4c9a" text-anchor="start" font-weight="600" font-family="'Source Sans Pro','Helvetica Neue',Arial,sans-serif" style="" >not yet measured</text><text x="712.00" y="150.00" font-size="12.5" fill="#aab5b0" text-anchor="start" font-weight="400" font-family="'Source Sans Pro','Helvetica Neue',Arial,sans-serif" style="" >contact intention + subgoal</text><text x="300.00" y="195.00" font-size="13.5" fill="#1c2b26" text-anchor="end" font-weight="400" font-family="'Source Sans Pro','Helvetica Neue',Arial,sans-serif" style="" >teacher, tries everything</text><rect x="316" y="174" width="384" height="30" rx="5" fill="#f4f6f4" stroke="#dce3dd" stroke-width="1"/><rect x="316" y="174" width="353" height="30" rx="5" fill="#1c2b26" opacity="0.85"><animate attributeName="width" values="0;353" dur="1.1s" begin="0.5800000000000001s" fill="freeze"/></rect><text x="300.00" y="239.00" font-size="13.5" fill="#1c2b26" text-anchor="end" font-weight="400" font-family="'Source Sans Pro','Helvetica Neue',Arial,sans-serif" style="" >closest-gap-first</text><rect x="316" y="218" width="384" height="30" rx="5" fill="#f4f6f4" stroke="#dce3dd" stroke-width="1"/><rect x="316" y="218" width="284" height="30" rx="5" fill="#aab5b0" opacity="0.85"><animate attributeName="width" values="0;284" dur="1.1s" begin="0.72s" fill="freeze"/></rect><text x="712.00" y="238.00" font-size="12.5" fill="#aab5b0" text-anchor="start" font-weight="400" font-family="'Source Sans Pro','Helvetica Neue',Arial,sans-serif" style="" >misses two hops</text><text x="300.00" y="283.00" font-size="13.5" fill="#1c2b26" text-anchor="end" font-weight="400" font-family="'Source Sans Pro','Helvetica Neue',Arial,sans-serif" style="" >learned ranker</text><rect x="316" y="262" width="384" height="30" rx="5" fill="#f4f6f4" stroke="#dce3dd" stroke-width="1"/><rect x="316" y="262" width="154" height="30" rx="5" fill="#175b48" opacity="0.85"><animate attributeName="width" values="0;154" dur="1.1s" begin="0.8600000000000001s" fill="freeze"/></rect><text x="712.00" y="282.00" font-size="12.5" fill="#aab5b0" text-anchor="start" font-weight="400" font-family="'Source Sans Pro','Helvetica Neue',Arial,sans-serif" style="" >the claim to test</text><text x="300.00" y="327.00" font-size="13.5" fill="#1c2b26" text-anchor="end" font-weight="400" font-family="'Source Sans Pro','Helvetica Neue',Arial,sans-serif" style="" >shortest certified plan</text><rect x="316" y="306" width="384" height="30" rx="5" fill="#f4f6f4" stroke="#dce3dd" stroke-width="1"/><rect x="316" y="306" width="84" height="30" rx="5" fill="#b8860b" opacity="0.85"><animate attributeName="width" values="0;84" dur="1.1s" begin="1.0s" fill="freeze"/></rect><text x="712.00" y="326.00" font-size="12.5" fill="#aab5b0" text-anchor="start" font-weight="400" font-family="'Source Sans Pro','Helvetica Neue',Arial,sans-serif" style="" >the floor</text><text x="470.00" y="374.00" font-size="13.5" fill="#6b7a74" text-anchor="middle" font-weight="400" font-family="'Source Sans Pro','Helvetica Neue',Arial,sans-serif" style="" >the learned layer earns its place only if it sits below every baseline,</text><text x="470.00" y="394.00" font-size="13.5" fill="#6b7a74" text-anchor="middle" font-weight="400" font-family="'Source Sans Pro','Helvetica Neue',Arial,sans-serif" style="" >at equal budget and equal success rate</text></svg>
