<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 46 940 346" width="100%" class="fig" role="img" aria-label="The measurement"><title>The measurement</title><text x="470.00" y="58.00" font-size="15" fill="#175b48" text-anchor="middle" font-weight="600" font-family="'Latin Modern Math','STIX Two Math',Georgia,serif" style="" >N&#923; = calls to the local solver, from the query until the goal is reached</text><text x="284.00" y="113.00" font-size="13.5" fill="#1c2b26" text-anchor="end" font-weight="400" font-family="'Source Sans Pro','Helvetica Neue',Arial,sans-serif" style="" >no discrete search at all</text><rect x="300" y="92" width="400" height="30" rx="5" fill="#f4f6f4" stroke="#dce3dd" stroke-width="1"/><text x="312.00" y="112.00" font-size="13" fill="#6b4c9a" text-anchor="start" font-weight="600" font-family="'Source Sans Pro','Helvetica Neue',Arial,sans-serif" style="" >not yet measured</text><text x="712.00" y="112.00" font-size="12.5" fill="#aab5b0" text-anchor="start" font-weight="400" font-family="'Source Sans Pro','Helvetica Neue',Arial,sans-serif" style="" >must be run first</text><text x="284.00" y="161.00" font-size="13.5" fill="#1c2b26" text-anchor="end" font-weight="400" font-family="'Source Sans Pro','Helvetica Neue',Arial,sans-serif" style="" >teacher, tries everything</text><rect x="300" y="140" width="400" height="30" rx="5" fill="#f4f6f4" stroke="#dce3dd" stroke-width="1"/><rect x="300" y="140" width="368" height="30" rx="5" fill="#1c2b26" opacity="0.85"><animate attributeName="width" values="0;368" dur="1.1s" begin="0.44s" fill="freeze"/></rect><text x="284.00" y="209.00" font-size="13.5" fill="#1c2b26" text-anchor="end" font-weight="400" font-family="'Source Sans Pro','Helvetica Neue',Arial,sans-serif" style="" >closest-gap-first</text><rect x="300" y="188" width="400" height="30" rx="5" fill="#f4f6f4" stroke="#dce3dd" stroke-width="1"/><rect x="300" y="188" width="296" height="30" rx="5" fill="#aab5b0" opacity="0.85"><animate attributeName="width" values="0;296" dur="1.1s" begin="0.5800000000000001s" fill="freeze"/></rect><text x="712.00" y="208.00" font-size="12.5" fill="#aab5b0" text-anchor="start" font-weight="400" font-family="'Source Sans Pro','Helvetica Neue',Arial,sans-serif" style="" >misses two hops</text><text x="284.00" y="257.00" font-size="13.5" fill="#1c2b26" text-anchor="end" font-weight="400" font-family="'Source Sans Pro','Helvetica Neue',Arial,sans-serif" style="" >learned ranker</text><rect x="300" y="236" width="400" height="30" rx="5" fill="#f4f6f4" stroke="#dce3dd" stroke-width="1"/><rect x="300" y="236" width="160" height="30" rx="5" fill="#175b48" opacity="0.85"><animate attributeName="width" values="0;160" dur="1.1s" begin="0.72s" fill="freeze"/></rect><text x="712.00" y="256.00" font-size="12.5" fill="#aab5b0" text-anchor="start" font-weight="400" font-family="'Source Sans Pro','Helvetica Neue',Arial,sans-serif" style="" >the claim to test</text><text x="284.00" y="305.00" font-size="13.5" fill="#1c2b26" text-anchor="end" font-weight="400" font-family="'Source Sans Pro','Helvetica Neue',Arial,sans-serif" style="" >shortest certified plan</text><rect x="300" y="284" width="400" height="30" rx="5" fill="#f4f6f4" stroke="#dce3dd" stroke-width="1"/><rect x="300" y="284" width="88" height="30" rx="5" fill="#b8860b" opacity="0.85"><animate attributeName="width" values="0;88" dur="1.1s" begin="0.8600000000000001s" fill="freeze"/></rect><text x="712.00" y="304.00" font-size="12.5" fill="#aab5b0" text-anchor="start" font-weight="400" font-family="'Source Sans Pro','Helvetica Neue',Arial,sans-serif" style="" >the floor</text><text x="470.00" y="356.00" font-size="13.5" fill="#6b7a74" text-anchor="middle" font-weight="400" font-family="'Source Sans Pro','Helvetica Neue',Arial,sans-serif" style="" >the learned layer earns its place only if it sits below every baseline,</text><text x="470.00" y="376.00" font-size="13.5" fill="#6b7a74" text-anchor="middle" font-weight="400" font-family="'Source Sans Pro','Helvetica Neue',Arial,sans-serif" style="" >at equal budget and equal success rate</text></svg>
