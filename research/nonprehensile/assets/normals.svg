,242.10 713.50,238.88 713.50,245.32" fill="#175b48" /><text x="705.00" y="330.00" font-size="14" fill="#175b48" text-anchor="middle" font-weight="600" font-family="'Source Sans Pro','Helvetica Neue',Arial,sans-serif" style="" >can push the box toward the goal</text><line x1="470" y1="56" x2="470" y2="344" stroke="#dce3dd" stroke-width="1.4"/><text x="470.00" y="372.00" font-size="16" fill="#175b48" text-anchor="middle" font-weight="700" font-family="'Latin Modern Math',Georgia,serif" style="" >so make(m<tspan baseline-shift="sub" font-size="0.68em">z</tspan>) must precede break(s)</text><text x="470.00" y="394.00" font-size="13" fill="#aab5b0" text-anchor="middle" font-weight="400" font-family="'Source Sans Pro','Helvetica Neue',Arial,sans-serif" style="" >a fact about this pose, which no fixed ordering of actions can encode</text></svg>
