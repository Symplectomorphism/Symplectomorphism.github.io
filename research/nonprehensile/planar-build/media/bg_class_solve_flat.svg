<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 330" width="560" height="330" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="560" height="330" fill="#ffffff"/>
  <!-- platform: top at z = 31.25 mm, its end (the corner e0) at x = 0; +x points LEFT -->
  <rect x="20" y="250" width="280" height="45" fill="#d9d9d9" stroke="#555" stroke-width="1.2"/>
  <text x="40" y="280" fill="#333">platform</text>
  <!-- block: side 125 mm, overhanging the platform's end -->
  <rect x="198" y="50" width="200" height="200" fill="#e8eef7" stroke="#1a4f9c" stroke-width="2"/>
  <text x="250" y="110" fill="#1a4f9c" font-weight="bold">block</text>
  <circle cx="298" cy="150" r="3" fill="#1a4f9c"/>
  <text x="305" y="146" fill="#1a4f9c">c</text>
  <!-- disk on the block's face (the face's outward normal points in -x, to the right here) -->
  <circle cx="423" cy="182" r="25" fill="#fbe9d7" stroke="#b26a00" stroke-width="2"/>
  <text x="408" y="226" fill="#b26a00" font-weight="bold">disk</text>
  <!-- support points -->
  <circle cx="300" cy="250" r="4" fill="#000"/>
  <text x="306" y="268">e₀ (platform corner)</text>
  <circle cx="198" cy="250" r="4" fill="#000"/>
  <text x="150" y="268">b₁</text>
  <!-- normal forces at the supports: vertical, up -->
  <line x1="300" y1="250" x2="300" y2="200" stroke="#2e7d32" stroke-width="2.5" marker-end="url(#ah)"/>
  <text x="306" y="214" fill="#2e7d32">λ<tspan baseline-shift="sub" font-size="10">n,1</tspan></text>
  <line x1="208" y1="250" x2="208" y2="200" stroke="#2e7d32" stroke-width="2.5" marker-end="url(#ah)"/>
  <text x="214" y="214" fill="#2e7d32">λ<tspan baseline-shift="sub" font-size="10">n,2</tspan></text>
  <!-- friction at the supports: horizontal, against the slide -->
  <line x1="268" y1="242" x2="292" y2="242" stroke="#2e7d32" stroke-width="2" marker-end="url(#ah)"/>
  <text x="232" y="238" fill="#2e7d32">μ<tspan baseline-shift="sub" font-size="10">e</tspan>λ<tspan baseline-shift="sub" font-size="10">n</tspan></text>
  <!-- the block's slide: +x (left) -->
  <line x1="180" y1="30" x2="120" y2="30" stroke="#1a4f9c" stroke-width="2.5" marker-end="url(#ah)"/>
  <text x="128" y="22" fill="#1a4f9c">v<tspan baseline-shift="sub" font-size="10">B</tspan> &gt; 0</text>
  <!-- disk contact: the disk pushes the block in +x -->
  <line x1="398" y1="182" x2="362" y2="182" stroke="#2e7d32" stroke-width="2.5" marker-end="url(#ah)"/>
  <text x="350" y="174" fill="#2e7d32">λ<tspan baseline-shift="sub" font-size="10">n,D</tspan></text>
  <!-- the hold force on the disk, horizontal -->
  <line x1="535" y1="182" x2="452" y2="182" stroke="#b26a00" stroke-width="2.5" marker-end="url(#ah)"/>
  <text x="468" y="202" fill="#b26a00">u = 0.1 N</text>
  <!-- the disk's tangent t_D (down) and its slip up the face -->
  <line x1="520" y1="96" x2="520" y2="130" stroke="#555" stroke-width="2" marker-end="url(#ah)"/>
  <text x="527" y="118" fill="#555">t<tspan baseline-shift="sub" font-size="10">D</tspan></text>
  <line x1="423" y1="150" x2="423" y2="110" stroke="#b26a00" stroke-width="2.5" marker-end="url(#ah)"/>
  <text x="432" y="122" fill="#b26a00">v<tspan baseline-shift="sub" font-size="10">s</tspan> &gt; 0</text>
  <!-- axes -->
  <line x1="520" y1="300" x2="480" y2="300" stroke="#000" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="462" y="304">+x</text>
  <line x1="520" y1="300" x2="520" y2="262" stroke="#000" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="526" y="270">+z</text>
</svg>
