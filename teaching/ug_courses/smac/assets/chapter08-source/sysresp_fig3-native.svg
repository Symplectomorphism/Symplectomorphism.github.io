<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 320" role="img" aria-labelledby="title desc">
  <title id="title">First-order DC motor speed-response block diagram</title>
  <desc id="desc">The armature voltage and load torque enter a summing junction, followed by the motor transfer function K sub m over T sub m s plus one, producing angular speed.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#000"/>
    </marker>
  </defs>
  <g fill="none" stroke="#000" stroke-width="6">
    <line x1="130" y1="185" x2="302" y2="185" marker-end="url(#arrow)"/>
    <circle cx="340" cy="185" r="31" fill="#fff"/>
    <line x1="371" y1="185" x2="565" y2="185" marker-end="url(#arrow)"/>
    <line x1="340" y1="42" x2="340" y2="145" marker-end="url(#arrow)"/>
    <rect x="580" y="72" width="270" height="220"/>
    <line x1="625" y1="177" x2="805" y2="177" stroke-width="4"/>
    <line x1="850" y1="185" x2="1070" y2="185" marker-end="url(#arrow)"/>
  </g>
  <g fill="#000" font-family="Cambria Math, STIX Two Text, Times New Roman, serif" font-style="italic">
    <text x="22" y="201" font-size="60">V<tspan x="70" y="218" font-size="38">a</tspan><tspan x="94" y="201">(s)</tspan></text>
    <text x="250" y="32" font-size="54">K<tspan x="294" y="46" font-size="34">L</tspan><tspan x="320" y="32" font-size="54">τ</tspan><tspan x="358" y="46" font-size="34">L</tspan><tspan x="382" y="32" font-size="54">(s)</tspan></text>
    <text x="297" y="176" font-size="54" font-style="normal">−</text>
    <text x="655" y="154" font-size="70">K</text>
    <text x="709" y="169" font-size="42">m</text>
    <text x="622" y="254" font-size="64">T</text>
    <text x="667" y="269" font-size="38">m</text>
    <text x="702" y="254" font-size="64">s + 1</text>
    <text x="1090" y="202" font-size="60">ω(s)</text>
  </g>
</svg>