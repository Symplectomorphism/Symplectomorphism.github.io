<svg xmlns="http://www.w3.org/2000/svg" width="600" height="450" viewBox="0 0 600 450" role="img" aria-labelledby="title"><title id="title">Normal velocity before and after impact</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="context-stroke"/></marker></defs><rect width="600" height="450" fill="white"/><g font-family="Arial, sans-serif"><path d="M30 385L570 385" stroke="#243b53" stroke-width="5" fill="none"/><circle cx="150" cy="205" r="43" fill="#edf1f5" stroke="#243b53" stroke-width="3"/><circle cx="440" cy="205" r="43" fill="#edf1f5" stroke="#243b53" stroke-width="3"/><path d="M150 258L150 362" stroke="#b15a16" stroke-width="5" fill="none" marker-end="url(#arrow)"/><text x="79" y="124" fill="#243b53" font-size="24">Before impact</text><text x="67" y="295" fill="#b15a16" font-size="22">3 m/s</text><path d="M440 152L440 60" stroke="#087e8b" stroke-width="5" fill="none" marker-end="url(#arrow)"/><text x="366" y="295" fill="#243b53" font-size="24">After impact</text><text x="465" y="99" fill="#087e8b" font-size="22">1.8 m/s</text><text x="115" y="212" fill="#243b53" font-size="21">0.5 kg</text><text x="405" y="212" fill="#243b53" font-size="21">0.5 kg</text><text x="160" y="430" fill="#7d8790" font-size="22">Fixed floor, upward normal</text></g></svg>