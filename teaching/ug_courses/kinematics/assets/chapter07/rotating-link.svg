<svg xmlns="http://www.w3.org/2000/svg" width="560" height="440" viewBox="0 0 560 440" role="img" aria-labelledby="title desc">
  <title id="title">Fixed-pivot rotating link at the illustrated instant</title>
  <desc id="desc">Q is fixed. P is 0.4 meters to the right of Q. Angular velocity and angular acceleration are counterclockwise, along positive z out of the page. P's velocity points upward.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="context-stroke"/></marker>
  </defs>
  <rect width="560" height="440" fill="white"/>
  <g font-family="Arial, sans-serif" font-size="24" fill="#172b3a">
    <g stroke="#78838c" stroke-width="2" marker-end="url(#arrow)">
      <path d="M110 300H515"/><path d="M110 300V65"/>
    </g>
    <text x="512" y="331">x</text><text x="82" y="67">y</text>
    <path d="M110 300H410" stroke="#243b53" stroke-width="14" stroke-linecap="round"/>
    <circle cx="110" cy="300" r="10" fill="white" stroke="#243b53" stroke-width="3"/>
    <circle cx="410" cy="300" r="8" fill="#243b53"/>
    <text x="75" y="338">Q</text><text x="75" y="367" font-size="21">fixed</text>
    <text x="423" y="330">P</text>
    <path d="M125 390H400" stroke="#243b53" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <text x="212" y="424">0.4 m</text>
    <path d="M410 284V112" stroke="#087e8b" stroke-width="4" marker-end="url(#arrow)"/>
    <text x="428" y="170" fill="#087e8b">v<tspan baseline-shift="sub" font-size="17">P</tspan></text>
    <path d="M193 271A88 88 0 0 0 139 217" fill="none" stroke="#b15a16" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="166" y="105" fill="#b15a16">ω = 3 rad/s</text>
    <text x="166" y="140" fill="#b15a16">α = 2 rad/s²</text>
    <circle cx="34" cy="407" r="12" fill="none" stroke="#172b3a" stroke-width="2"/>
    <circle cx="34" cy="407" r="3"/>
    <text x="55" y="415" font-size="20">+z out</text>
  </g>
</svg>
