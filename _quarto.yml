format:
  html:
    theme:
      - cosmo
      - brand
    css: styles.css
    toc: true
    light: flatly
    dark: darkly
    toggle: true
    respect-user-color-scheme: true
    include-before-body: _math_macros.qmd
    html-math-method: mathjax
    include-in-header:
      text: |
        <script>
        window.MathJax = {
          loader: {
            load: ['[tex]/boldsymbol', '[tex]/mathtools']
          },
          tex: {
            packages: {'[+]': ['boldsymbol', 'mathtools']}
          }
        };
        </script>
